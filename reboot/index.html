<!doctype html>
<!--
  PROTOTYPE · creative reboot, round 1. Dev-only: `npm run reboot` (or /reboot/ on `npm run dev`).
  Not a build input (vite.config has only index.html), so none of this ships with the live site.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Patidar Doors · round 1 (prototype)</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@400;600;800;900&family=DM+Mono:wght@400;500&family=Syne:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    />
    <script>
      // PROTOTYPE: pick the variant before first paint, so a reload never flashes the wrong one
      ;(function () {
        var k = (new URLSearchParams(location.search).get('variant') || 'A').toUpperCase()
        if (!/^[A-D]$/.test(k)) k = 'A'
        document.documentElement.dataset.variant = k
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/reboot/main.tsx"></script>
  </body>
</html>
