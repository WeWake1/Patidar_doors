<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
         numbers; the fixed chrome (nav, cart drawer, toast, WhatsApp float) pads
         itself off the notch and home bar in global.css -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F0E6" />
    <title>Patidar Doors — Timber, doors, ply & WPC</title>
    <meta
      name="description"
      content="Patidar Doors by Patidar Timbers — teak timbers, made-to-measure doors, plywood and WPC from our own yard and factory. Explore online, then see everything in person at our store."
    />
    <link rel="canonical" href="https://patidartimbers.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Patidar Doors — Timber, doors, ply & WPC" />
    <meta
      property="og:description"
      content="Teak timbers, made-to-measure doors, plywood and WPC — factory direct from Patidar Timbers. Visit the store to see it all in person."
    />
    <meta property="og:site_name" content="Patidar Doors" />
    <meta property="og:url" content="https://patidartimbers.com/" />
    <!--
      ⚠️ og:image and twitter:image MUST be absolute. A relative path is not
      resolved by any of the scrapers that matter — WhatsApp, Facebook,
      Twitter/X, LinkedIn all simply drop the image — and WhatsApp is this
      business's channel, so a link shared into a customer chat is the single
      most common way the site is seen for the first time. These were
      `/images/logo/og-image.png` and rendered no card anywhere.

      Absolute means the whole origin, and the origin is the domain the site is
      served from: patidartimbers.com. If that ever changes, these three URLs
      and the canonical above change with it — nothing derives them at build
      time, because this file is static and there is no vite config.
    -->
    <meta property="og:image" content="https://patidartimbers.com/images/logo/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Patidar Doors — doors, plywoods and boards" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://patidartimbers.com/images/logo/og-image.png" />
    <!--
      The brand faces are self-hosted (public/fonts, generated by
      scripts/fetch-fonts.mjs) and preloaded here rather than pulled from
      fonts.googleapis.com. This site is client-rendered, so there is no text in
      this document for the browser to match a @font-face against — via Google
      the chain was html → css2 on a third origin → woff2, and the woff2 leg
      could not start until React had rendered. Measured on a throttled
      mid-range phone: fonts began at 1383ms and swapped in at 2820ms, so every
      visitor read the hero in Georgia and then watched it reflow.

      Preloading starts them with the bundle instead of after it, which is what
      takes layout shift on this page to zero.

      Exactly two, and the list is measured rather than reasoned. A preload is
      fetched ahead of the module script, so on a saturated link every preloaded
      byte is a byte the bundle waits for — and nothing paints at all until the
      bundle runs. These two take shift to 0; adding the italic cost 120ms of
      first paint at 1.6 Mbps and bought no further stability, because one
      italic word inside an already-correct headline does not move the line.
      latin-ext is left out for the same reason: it carries ₹ (U+20AD-20C0), the
      browser fetches a subset only once a glyph needs it, and no price is above
      the fold.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/cormorant-garamond-normal-400-600-latin.woff2"
      crossorigin
    />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/archivo-normal-400-800-latin.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!--
      The site is client-rendered, so no JavaScript means no page at all. The
      goal of this site is footfall to Nagasandra — a visitor with a blocked or
      broken bundle should still leave with the address and the phone number.
      Styled inline on purpose: in dev the stylesheet is injected by the very
      script that isn't running here.
    -->
    <noscript>
      <div
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 12vw 6vw;
          background: #f5f0e6;
          color: #211a12;
          font: 400 16px/1.6 Archivo, system-ui, sans-serif;
        "
      >
        <div style="max-width: 46rem">
          <p
            style="
              margin: 0 0 22px;
              font: 600 12px Archivo, system-ui, sans-serif;
              letter-spacing: 0.34em;
              text-transform: uppercase;
              color: #7d6234;
            "
          >
            Patidar Doors · by Patidar Timbers
          </p>
          <h1
            style="
              margin: 0;
              font: 500 clamp(38px, 7vw, 64px) / 1.04 'Cormorant Garamond', Georgia, serif;
              color: #211a12;
            "
          >
            The catalogue needs JavaScript. The store doesn’t.
          </h1>
          <p style="margin: 22px 0 0; color: #5f5342; max-width: 52ch">
            Everything on this site is standing on our floor in Nagasandra — teak timbers,
            made-to-measure doors, plywood and WPC, sawn in our own yard and finished in our own
            factory. Come and see it, or call and we’ll tell you what’s in stock today.
          </p>
          <hr style="border: 0; border-top: 1px solid #d9cdb2; margin: 34px 0" />
          <!-- One line each: a separator between them dangles at the end of the
               line on a phone, where this page matters most. -->
          <p style="margin: 0 0 6px; font-size: 20px">
            <a href="tel:+919611953838" style="color: #211a12; font-weight: 600"
              >+91 96119 53838</a
            >
          </p>
          <p style="margin: 0 0 6px">
            <a href="mailto:patidartimber.pt@gmail.com" style="color: #7d6234"
              >patidartimber.pt@gmail.com</a
            >
          </p>
          <p style="margin: 0 0 18px; color: #5f5342">Mon–Sat, 9am–7pm IST</p>
          <address style="margin: 0; font-style: normal; color: #5f5342; max-width: 46ch">
            No 382, Opp IKEA &amp; Nagsandra Metro Station, Opp Flyover Pillar No 115, Corner Site
            of Vikas Nagar 1st Cross Entrance, National Highway 4, Tumkur Road, Nagasandra,
            Bengaluru, Karnataka 560073
          </address>
          <p style="margin: 26px 0 0">
            <a
              href="https://share.google/0ZGoQQAgdRaHQDSNI"
              style="
                display: inline-block;
                padding: 13px 24px;
                background: #211a12;
                color: #f5f0e6;
                text-decoration: none;
                font: 500 12px Archivo, system-ui, sans-serif;
                letter-spacing: 0.22em;
                text-transform: uppercase;
              "
              >Directions to the store</a
            >
          </p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
